<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Periodización de pacientes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F5F6;--sf:#fff;--ink:#12303A;--mut:#5B7480;--line:#D5DFE3;--brand:#0F5C63;--bi:#fff;--low:#3E9E9A;--mid:#D9A21F;--high:#B8384A;--tint:#E3ECEE;--s1:#D6E6E8;--s2:#C3DADD;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A1F;--sf:#15262D;--ink:#E4EEF1;--mut:#8FA6B0;--line:#28434D;--brand:#5CC0C4;--bi:#08262A;--low:#4DB6B0;--mid:#E7B84A;--high:#E0687A;--tint:#1D343C;--s1:#1F3A42;--s2:#2A4A54}}
:root[data-theme="dark"]{--bg:#0E1A1F;--sf:#15262D;--ink:#E4EEF1;--mut:#8FA6B0;--line:#28434D;--brand:#5CC0C4;--bi:#08262A;--low:#4DB6B0;--mid:#E7B84A;--high:#E0687A;--tint:#1D343C;--s1:#1F3A42;--s2:#2A4A54}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0}
h1{font-size:26px}h2{font-size:19px;margin-bottom:10px}h4{font-size:15px;margin:12px 0 6px}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.st{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px 14px;font:600 14px Figtree,system-ui,sans-serif;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
details.card summary{cursor:pointer;font:600 17px 'Bricolage Grotesque',Figtree,sans-serif}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
.btn{background:var(--brand);color:var(--bi);border:1px solid var(--brand);border-radius:9px;padding:10px 14px;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;width:auto}
.btn.sec{background:transparent;color:var(--brand)}
.btn.dg{background:transparent;color:var(--high);border-color:var(--high)}
.lnk{background:none;border:0;color:var(--brand);font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;padding:6px 0}
.ic{width:34px;height:34px;border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;cursor:pointer;font-size:18px;padding:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.bar select{width:auto;min-width:200px}
.now{font-size:14px}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.scroll{overflow-x:auto}
.scroll svg{min-width:900px;width:100%;height:auto;display:block}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--mut);font-size:10.5px}
svg .mt{fill:var(--ink);font-size:10.5px;font-weight:600}
svg .meso{fill:var(--tint)}
svg .seg{fill:var(--s1)}svg .seg.alt{fill:var(--s2)}
svg .st{fill:var(--ink);font-size:10.5px}
svg .b-low{fill:var(--low)}svg .b-mid{fill:var(--mid)}svg .b-high{fill:var(--high)}
svg .cur{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.meso-card{border:1px solid var(--line);border-radius:12px;padding:10px}
.mh{display:flex;flex-direction:column;margin-bottom:8px;font-size:13px}.mh span{color:var(--mut);font-size:12px;line-height:1.35}.mh i{font-style:normal;font-weight:600;color:var(--ink)}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wk{border-left:4px solid var(--line);padding-left:6px;gap:1px}
.wk small{font-size:11px}
.wk.c-low{border-color:var(--low)}.wk.c-mid{border-color:var(--mid)}.wk.c-high{border-color:var(--high)}
.sr{display:grid;grid-template-columns:1fr 70px 70px 34px;gap:6px;margin-bottom:6px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mut)}
.day{min-height:68px;background:var(--sf);border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:8px;padding:4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);font:inherit;min-width:0}
.day.o{opacity:.45}.day.sel{outline:2px solid var(--brand)}
.day.t-low{border-bottom-color:var(--low)}.day.t-mid{border-bottom-color:var(--mid)}.day.t-high{border-bottom-color:var(--high)}
.dn{font-size:13px;font-weight:600;width:22px;height:22px;display:grid;place-items:center}
.today .dn{background:var(--brand);color:var(--bi);border-radius:50%}
.chip{font-size:11px;border-radius:5px;padding:0 4px;background:var(--brand);color:var(--bi);border:1px solid var(--brand);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.np{background:transparent;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.badge{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid var(--brand);color:var(--brand)}
.badge.ok{background:var(--brand);color:var(--bi)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:700 22px 'Bricolage Grotesque',Figtree,sans-serif}.kpi span{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mut);border-top:0}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.w2{grid-column:span 2}
.empty{text-align:center;padding:36px 16px}.empty p{color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(10,25,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--sf);width:min(820px,100%);max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.ef{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.plan{border-left:4px solid var(--line);padding:6px 10px;background:var(--tint);border-radius:6px;font-size:14px}
.plan.c-low{border-color:var(--low)}.plan.c-mid{border-color:var(--mid)}.plan.c-high{border-color:var(--high)}
button.pcell{font:inherit;color:var(--ink);background:var(--sf);cursor:pointer;text-align:left}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pcell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.pcell span{font-size:12px;color:var(--mut)}.pcell b{font:700 18px 'Bricolage Grotesque',Figtree,sans-serif}
.pcell.on{border-color:var(--brand);background:var(--tint)}
.res{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:6px 0}.res span{color:var(--mut)}
.res b{font:700 40px/1.1 'Bricolage Grotesque',Figtree,sans-serif;color:var(--brand)}
.rm{display:grid;grid-template-columns:1fr 90px auto 34px;gap:6px;margin-bottom:6px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:200px;resize:vertical}
.tg{border:1px solid var(--line);border-radius:12px;background:var(--sf);overflow:auto;max-height:68vh}
.tgh,.tgb{display:grid;grid-template-columns:44px repeat(var(--n),minmax(0,1fr))}
.tgh{position:sticky;top:0;z-index:3;background:var(--sf);border-bottom:1px solid var(--line)}
.dh{border:0;border-bottom:4px solid transparent;border-left:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.dh small{color:var(--mut);font-size:12px;text-transform:capitalize}
.dh.t-low{border-bottom-color:var(--low)}.dh.t-mid{border-bottom-color:var(--mid)}.dh.t-high{border-bottom-color:var(--high)}
.hl{position:relative}.hl span{position:absolute;right:6px;font-size:11px;color:var(--mut)}
.tc{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);cursor:cell}
.tc.td{background-color:var(--tint)}
.ev{position:absolute;border:0;border-radius:6px;padding:3px 6px;font:12px/1.25 Figtree,system-ui,sans-serif;color:#fff;text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.ev{background:var(--c)}.ev.pend{background:var(--sf);color:var(--ink);border:2px dashed var(--c)}.ev.canc{background:var(--tint);color:var(--mut);text-decoration:line-through;border-left:4px solid var(--c)}.chip.cx{text-decoration:line-through;opacity:.6}
.nl{position:absolute;left:0;right:0;height:2px;background:var(--high);z-index:1;pointer-events:none}
.seg-t{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg-t button{border:0;background:none;color:var(--mut);padding:7px 12px;font:600 13px Figtree,system-ui,sans-serif;cursor:pointer}
.seg-t .on{background:var(--brand);color:var(--bi)}
@media(max-width:640px){.day{min-height:54px}.w2{grid-column:auto}}
.ex{display:grid;grid-template-columns:3fr 1fr 1fr 1.2fr 34px;gap:6px;margin-bottom:6px}
.ex.hd{font-size:12px;color:var(--mut);margin-bottom:2px}
@media(max-width:640px){.ex.hd{display:none}.ex .n{grid-column:1/3;grid-row:1}.ex .x{grid-column:3;grid-row:1;justify-self:end}.ex .s{grid-column:1;grid-row:2}.ex .r{grid-column:2;grid-row:2}.ex .p{grid-column:3;grid-row:2}.ex{grid-template-columns:1fr 1fr 1fr;margin-bottom:12px}}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}

<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* Fuera de Claude no existe window.claude: se crea solo la descarga de archivos (respaldos y PDF). Los datos quedan en este navegador. */
if(!window.claude){window.claude={use:async n=>n==='downloads'?{save:async({filename,data})=>{const t=/\.pdf$/i.test(filename)?'application/pdf':'application/json';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:t}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}:null}}
</script>
<script>
const LANES=['Fase','Fuerza/Pot.','Resistencia','Vel/agilidad'];
const BLOCKS=['Movilidad','Warm up','Core / estabilizadores / balance','Fuerza / resistencia / velocidad'];
const NAME={low:'descarga',mid:'carga media',high:'carga alta'};
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T00:00:00');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const sd=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const money=n=>'$'+Math.round(n).toLocaleString('es-CL');
const clp=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const pr=s=>+s.price||0;
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const bd=s=>{const r=clp(pat(s.pid)?.rate);return r>0&&pr(s)!==r};
const cls=v=>v<70?'low':v<80?'mid':'high';
const clone=o=>JSON.parse(JSON.stringify(o));
const WAVE=[60,70,80,70];
const defPct=()=>Array.from({length:48},(_,i)=>WAVE[i%4]);
const S0=(a,l,f,t)=>({lane:a,label:l,from:f,to:t});
const defSegs=()=>[S0('Fase','Preparatoria',1,8),S0('Fase','Competitiva',9,44),S0('Fase','Transición',45,48),
S0('Fuerza/Pot.','Fuerza máxima / hipertrofia',1,12),S0('Fuerza/Pot.','Conversión de la fuerza',13,24),S0('Fuerza/Pot.','Mantenimiento de fuerza y conversión',25,44),S0('Fuerza/Pot.','Compensación',45,48),
S0('Resistencia','Por tiempo',1,2),S0('Resistencia','Int. aeróbico',3,5),S0('Resistencia','Int. anaeróbico',6,8),S0('Resistencia','Resistencia específica',9,16),S0('Resistencia','Mantenimiento',17,44),S0('Resistencia','Lento larga duración',45,48),
S0('Vel/agilidad','Sprint',1,2),S0('Vel/agilidad','Aceleración',3,5),S0('Vel/agilidad','Aceleración y velocidad máxima',6,14),S0('Vel/agilidad','Mantenimiento',15,44)];
const newPat=()=>({id:uid(),name:'Paciente nuevo',age:'',rate:0,wt:'',sx:'',start:iso(mondayOf(new Date())),comp:'',rms:[],pct:defPct(),segs:defSegs()});

let S={patients:[],sessions:[],sel:''};
const now0=new Date();
let V={tab:'plan',mon:new Date(now0.getFullYear(),now0.getMonth(),1),day:iso(now0),view:innerWidth<700?'day':'week',calc:{base:'',pct:'',rd:'1',w:'',reps:'',e:0},armed:null,ED:null,PH:null,draft:null,pk:'',status:'',edMsg:'',focus:null,evd:null};
let store=null,D={meta:false,ses:new Set()},ft;

const pat=id=>S.patients.find(p=>p.id===id);
const curP=()=>pat(S.sel);
const weekOf=(p,ds)=>Math.floor(Math.round((pd(ds)-pd(p.start))/864e5)/7)+1;
const info=(p,w)=>{const v=p.pct[w-1];return `Semana ${w} (mesociclo ${Math.ceil(w/4)}, microciclo ${(w-1)%4+1}): ${NAME[cls(v)]}, ${v}%`};

/* ---------- guardado ---------- */
function setStatus(t){V.status=t;const e=$('#st');if(e)e.textContent=t}
function saveMeta(){D.meta=true;queue()}
function saveSes(id){D.ses.add(id);queue()}
function queue(){setStatus('Guardando…');clearTimeout(ft);ft=setTimeout(flush,500)}
async function flush(){
  try{localStorage.setItem('perio',JSON.stringify(S))}catch(e){}
  if(!store){setStatus('Guardado en este navegador');return}
  try{
    if(D.meta){D.meta=false;await store.doc('meta').set({json:JSON.stringify({patients:S.patients,sel:S.sel})})}
    for(const id of [...D.ses]){D.ses.delete(id);const s=S.sessions.find(x=>x.id===id);const r=store.doc('s_'+id);if(s)await r.set({json:JSON.stringify(s)});else await r.delete()}
    setStatus('Guardado y sincronizado');
  }catch(e){setStatus('Guardado solo en este navegador')}
}
async function init(){
  try{const r=localStorage.getItem('perio');if(r){S=Object.assign(S,JSON.parse(r));S.sessions.forEach(norm)}}catch(e){}
  if(!S.patients.length)V.tab='pac';
  render();
  try{rawGet('draft').then(d=>{const n=d?(d.chans?d.chans.some(c=>c.t&&c.t.length):!!(d.t&&d.t.length)):false;if(n&&!HR.run){V.draft={date:(d.gs&&d.gs[0]&&d.gs[0].date)||(d.sess&&d.sess.date)};render()}}).catch(()=>{})}catch(e){}
  try{
    if(!window.claude)return;
    const c=await claude.use('db'),u=await claude.use('user');
    if(!c||!u)return;
    const id=await u.id();if(!id)return;
    store=c.collection('data/users/'+id);
    const snap=await store.get();
    const meta=snap.docs.find(d=>d.id==='meta');
    if(meta&&!D.meta&&!D.ses.size){
      const m=JSON.parse(meta.data().json);
      S={patients:m.patients||[],sessions:snap.docs.filter(d=>d.id.startsWith('s_')).map(d=>norm(JSON.parse(d.data().json))),sel:m.sel||''};
      if(S.patients.length&&V.tab==='pac')V.tab='plan';
      setStatus('Sincronizado');render();
    }else if(S.patients.length||D.meta||D.ses.size){D.meta=true;S.sessions.forEach(s=>D.ses.add(s.id));flush()}
    else setStatus('Sincronización lista');
  }catch(e){}
}

/* ---------- vistas ---------- */
function render(){
  const og=$('.tg'),sc=og?og.scrollTop:null;
  const v={plan:viewPlan,cal:viewCal,pay:viewPay,calc:viewCalc,eva:viewEva,fis:viewFis,inf:viewInf,pac:viewPac}[V.tab]();
  const tabs=[['plan','Plan anual'],['cal','Calendario'],['calc','Calculadora'],['pay','Cobros'],['eva','Evaluación'],['fis','Fisiología'],['inf','Informe'],['pac','Pacientes']];
  $('#app').innerHTML=`<div class="wrap"><header class="hd"><h1>Periodización</h1><span class="st" id="st">${esc(V.status)}</span></header>
  ${draftBanner()}<nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${V.tab===k}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</nav>${v}</div>`;
  const g=$('.tg');if(g)g.scrollTop=sc??96;
  if(V.tab==='calc')updCalc();
  drawModal();
}
const empty=()=>`<section class="card empty"><h2>Aún no hay pacientes</h2><p>Agrega al primero para armar su periodización y registrar sesiones.</p><button class="btn" data-act="tab" data-t="pac">Ir a pacientes</button></section>`;
function patSelect(all,val,lab){return `<select data-sel aria-label="Paciente">${all?`<option value="">${lab||'Todos los pacientes'}</option>`:''}${S.patients.map(p=>`<option value="${p.id}" ${p.id===val?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}

function wrapW(label,w,fs){
  const cw=fs*0.56,maxw=w-8,lines=[];let cur='';
  for(const wd of label.split(' ')){
    if(wd.length*cw>maxw)return null;
    const t=cur?cur+' '+wd:wd;
    if(t.length*cw<=maxw)cur=t;else{lines.push(cur);cur=wd}
  }
  lines.push(cur);return lines.length<=3?lines:null;
}
function segLayout(label,w){
  for(const fs of [10.5,9.5]){const L=wrapW(label,w,fs);if(L)return {m:'h',L,fs,h:L.length*(fs+2.5)+8}}
  const fs=10,cw=fs*0.56,maxc=Math.floor(100/cw),maxN=Math.max(1,Math.min(3,Math.floor((w-4)/(fs+3))));
  const lines=[];let cur='';
  for(const wd of label.split(' ')){const t=cur?cur+' '+wd:wd;if(t.length<=maxc)cur=t;else{if(cur)lines.push(cur);cur=wd}}
  if(cur)lines.push(cur);
  const L=lines.slice(0,maxN);if(lines.length>maxN)L[maxN-1]=L[maxN-1].slice(0,maxc-1)+'…';
  return {m:'v',L,fs,h:Math.max(...L.map(x=>x.length))*cw+12};
}
function chartSVG(p){
  const X0=96,BW=20,T=10,H=190,W=X0+48*BW+8,cw=weekOf(p,iso(new Date()));
  const lanes=LANES.map(ln=>{const segs=p.segs.filter(g=>g.lane===ln&&g.to>=g.from).map(g=>({g,lay:segLayout(g.label,(g.to-g.from+1)*BW-2)}));return {ln,segs,h:Math.max(28,...segs.map(x=>x.lay.h))}});
  const y0=T+H+50,total=y0+lanes.reduce((a,l)=>a+l.h+6,0)+4;
  let s=`<svg viewBox="0 0 ${W} ${Math.ceil(total)}" role="img" aria-label="Carga semanal en porcentaje">`;
  for(let g=0;g<=100;g+=20){const y=T+H-H*g/100;s+=`<line class="gl" x1="${X0}" x2="${X0+48*BW}" y1="${y}" y2="${y}"/><text class="ax" x="${X0-6}" y="${y+3}" text-anchor="end">${g}%</text>`}
  p.pct.forEach((v,i)=>{const h=H*v/100,x=X0+i*BW;s+=`<rect class="b-${cls(v)}${i+1===cw?' cur':''}" x="${x+1.5}" y="${T+H-h}" width="${BW-3}" height="${h}" rx="2"><title>Semana ${i+1}: ${v}% (${NAME[cls(v)]})</title></rect>`});
  let lm=-1;
  for(let i=0;i<48;i++){const m=addDays(pd(p.start),i*7).getMonth();if(m!==lm){lm=m;s+=`<text class="ax" x="${X0+i*BW}" y="${T+H+16}">${MES[m].slice(0,3)}</text>`}}
  for(let m=0;m<12;m++){const x=X0+m*4*BW;s+=`<rect class="meso" x="${x+1}" y="${T+H+24}" width="${4*BW-2}" height="16" rx="3"/><text class="mt" x="${x+2*BW}" y="${T+H+36}" text-anchor="middle">Meso ${m+1}</text>`}
  let y=y0;
  lanes.forEach(({ln,segs,h})=>{
    s+=`<text class="ax" x="${X0-6}" y="${y+h/2+4}" text-anchor="end">${ln}</text>`;
    segs.forEach(({g,lay},gi)=>{
      const x=X0+(g.from-1)*BW,w=(g.to-g.from+1)*BW-2,cx=x+1+w/2;
      s+=`<rect class="seg${gi%2?' alt':''}" x="${x+1}" y="${y}" width="${Math.max(w,2)}" height="${h}" rx="4"><title>${esc(g.label)} (semanas ${g.from} a ${g.to})</title></rect>`;
      const n=lay.L.length,lh=lay.fs+2.5;
      if(lay.m==='h'){
        lay.L.forEach((t,j)=>{s+=`<text class="st" x="${cx}" y="${y+h/2-(n-1)*lh/2+j*lh+lay.fs*0.35}" text-anchor="middle" style="font-size:${lay.fs}px">${esc(t)}</text>`})
      }else{
        lay.L.forEach((t,j)=>{const tx=cx+(j-(n-1)/2)*(lay.fs+3)+lay.fs*0.35,ty=y+h/2;s+=`<text class="st" x="${tx}" y="${ty}" text-anchor="middle" transform="rotate(-90 ${tx} ${ty})" style="font-size:${lay.fs}px">${esc(t)}</text>`})
      }
    });
    y+=h+6;
  });
  return s+'</svg>';
}
const LSHORT={'Fase':'Fase','Fuerza/Pot.':'Fuerza','Resistencia':'Resist.','Vel/agilidad':'Vel.'};
function gridHTML(p){

    s+=`<div class="meso-card"><div class="mh"><b>Mesociclo ${m+1}</b>${em||'<span>Sin fase</span>'}</div><div class="mc">`;

const tm=s=>{const [h,m]=(s||'09:00').split(':');return (+h||0)*60+(+m||0)};
const fmt=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const byT=(x,y)=>(x.date+x.time).localeCompare(y.date+y.time);
const hue=id=>(Math.max(S.patients.findIndex(p=>p.id===id),0)*57+190)%360;
const loadCls=(p,ds)=>{if(!p)return '';const w=weekOf(p,ds);return w>=1&&w<=48?' t-'+cls(p.pct[w-1]):''};
function norm(s){
  if(s.txt==null){s.txt=(s.exs||[]).length?BLOCKS.map((b,bi)=>{const r=s.exs.filter(e=>e.b===bi);return r.length?b+':\n'+r.map(e=>'- '+[e.n,e.v,e.c&&'carga '+e.c,e.r&&'descanso '+e.r,e.o].filter(Boolean).join(', ')).join('\n'):''}).filter(Boolean).join('\n\n'):''}
  if(!Array.isArray(s.exs)||(s.exs[0]&&s.exs[0].b!==undefined))s.exs=[];
  s.exs.forEach(e=>{e.n=e.n||'';e.s=e.s??'';e.r=e.r??'';e.p=e.p??''});
  s.fc=Object.assign({rep:'',min:'',med:'',max:'',rec:'',kcal:''},s.fc||{});s.sym=Array.isArray(s.sym)?s.sym:[];if(s.rpe==null)s.rpe='';s.symtxt=s.symtxt||'';s.ty=Array.isArray(s.ty)?s.ty:[];s.price=pr(s);s.gid=s.gid||'';s.est=s.est||'conf';s.time=s.time||'09:00';s.dur=+s.dur||60;return s;
}
function tgrid(days,p){
  const HH=48,ids=days.map(iso),all=S.sessions.filter(s=>ids.includes(s.date)&&(!S.sel||s.pid===S.sel));
  let lo=6,hi=22;all.forEach(s=>{lo=Math.min(lo,Math.floor(tm(s.time)/60));hi=Math.max(hi,Math.ceil((tm(s.time)+s.dur)/60))});hi=Math.min(hi,24);
  const n=days.length,td=iso(new Date()),H=(hi-lo)*HH,nw=new Date(),nm=nw.getHours()*60+nw.getMinutes();
  const hdr=days.map(d=>{const ds=iso(d);return `<button class="dh${ds===td?' today':''}${loadCls(p,ds)}" data-act="gday" data-d="${ds}"><small>${d.toLocaleDateString('es-CL',{weekday:'short'})}</small><span class="dn">${d.getDate()}</span></button>`}).join('');
  const hrs=Array.from({length:hi-lo},(_,i)=>`<span style="top:${i*HH+2}px">${pad(lo+i)}:00</span>`).join('');
  const cols=days.map(d=>{
    const ds=iso(d),cs=[];
    uniq(all.filter(s=>s.date===ds).sort(byT)).forEach(s=>{const st=tm(s.time),en=st+s.dur;let c=cs[cs.length-1];if(!c||st>=c.end){c={end:en,lanes:[],it:[]};cs.push(c)}c.end=Math.max(c.end,en);let l=c.lanes.findIndex(x=>x<=st);if(l<0){l=c.lanes.length;c.lanes.push(0)}c.lanes[l]=en;c.it.push({s,l,st,en})});
    const evs=cs.flatMap(c=>c.it.map(({s,l,st,en})=>{const w=100/c.lanes.length;return `<button class="ev ${s.est}" data-act="edses" data-id="${s.id}" style="top:${(st-lo*60)/60*HH}px;height:${Math.max((en-st)/60*HH,24)-2}px;left:${l*w}%;width:calc(${w}% - 3px);--c:hsl(${hue(s.pid)} 50% 34%)"><b>${gPaid(s)?'✓ ':''}${esc(evName(s))}</b><br>${fmt(st)} a ${fmt(en)}${{pend:' (por confirmar)',canc:' (cancelada)',conf:''}[s.est]}</button>`})).join('');
    const nl=ds===td&&nm>=lo*60&&nm<hi*60?`<div class="nl" style="top:${(nm-lo*60)/60*HH}px"></div>`:'';
    return `<div class="tc${ds===td?' td':''}" data-act="slot" data-d="${ds}" data-lo="${lo}" style="height:${H}px">${evs}${nl}</div>`}).join('');
  return `<div class="tg"><div class="in" style="--n:${n};--hh:${HH}px;min-width:${n>1?700:0}px"><div class="tgh"><div></div>${hdr}</div><div class="tgb"><div class="hl" style="height:${H}px">${hrs}</div>${cols}</div></div></div>`;
}
function monthGrid(p){

  for(let i=0;i<42;i++){const d=addDays(st,i),ds=iso(d);if(i>=35&&i%7===0&&d.getMonth()!==m)break;

function hrClean(t,b){
  const T=[],B=[];let out=0;
  for(let i=0;i<t.length;i++){
    const v=b[i];if(!(v>=30&&v<=230)){out++;continue}
    const nb=[];for(let j=Math.max(0,i-2);j<=Math.min(t.length-1,i+2);j++)if(j!==i&&b[j]>=30&&b[j]<=230)nb.push(b[j]);
    if(nb.length>=3&&Math.abs(v-median(nb))>30){out++;continue}
    T.push(t[i]);B.push(v);
  }
  return {t:T,b:B,out};
}
function hrSeries(t,b,from,to,hold){
  hold=hold||5000;const n=Math.max(0,Math.floor((to-from)/1000)),o=new Array(n).fill(null);let k=-1;
  for(let s=0;s<n;s++){const end=from+(s+1)*1000;while(k+1<t.length&&t[k+1]<end)k++;o[s]=(k>=0&&end-t[k]<=hold&&t[k]>=from-hold)?b[k]:null}
  return o;
}
function smooth(a,w){
  w=w||5;const h=w>>1,o=new Array(a.length).fill(null);
  for(let i=0;i<a.length;i++){if(a[i]==null)continue;const v=[];for(let j=Math.max(0,i-h);j<=Math.min(a.length-1,i+h);j++)if(a[j]!=null)v.push(a[j]);if(v.length>=3)o[i]=median(v)}
  return o;
}
const valid=a=>a.filter(v=>v!=null);
function hrStats(sr){
  const v=valid(sr),sm=valid(smooth(sr,5));
  if(!v.length)return null;
  return {n:v.length,avg:mean(v),min:sm.length?Math.min(...sm):Math.min(...v),max:sm.length?Math.max(...sm):Math.max(...v)};
}
function hrQuality(sr,outliers,lost){
  const n=sr.length,v=valid(sr).length;let gaps=0,maxGap=0,run=0;
  for(let i=0;i<=n;i++){if(i<n&&sr[i]==null)run++;else{if(run>=6){gaps++;maxGap=Math.max(maxGap,run)}run=0}}
  const pct=n?v/n:0,label=pct>=0.95&&gaps===0?'buena':pct>=0.85?'aceptable':'baja';
  return {sec:n,valid:v,pct:rnd(pct*100,1),gaps,maxGap,out:outliers||0,lost:lost||0,label};
}
/* Zonas: devuelve límites en lpm. model 'pct' (porcentaje de FCmáx o de reserva, Karvonen) o 'umbrales' (umbrales medidos). */
function zoneSet(cfg,hrmax,hrrest,thr){
  cfg=Object.assign({},ZDEF,cfg||{});
  if(cfg.model==='umbrales'){
    const a=+(thr&&thr.vt1)||0,b=+(thr&&thr.vt2)||0;
    if(!(a>0&&b>a))return {ok:false,msg:'Faltan los dos umbrales medidos (1.º y 2.º) en la sección de umbrales.'};
    return {ok:true,model:'umbrales',base:'umbrales',text:'Umbrales medidos en prueba de esfuerzo ('+(thr.kind||'ventilatorios o de lactato')+(thr.date?', '+thr.date:'')+')',
      items:[{n:'Zona 1',t:'Bajo el 1.er umbral',lo:0,hi:a},{n:'Zona 2',t:'Entre umbrales',lo:a,hi:b},{n:'Zona 3',t:'Sobre el 2.º umbral',lo:b,hi:null}]};
  }
  if(!(hrmax>0))return {ok:false,msg:'Falta la FC máxima de referencia (agrega la edad o una FC máxima medida).'};
  const res=cfg.base==='reserva';
  if(res&&!(hrrest>0&&hrmax>hrrest))return {ok:false,msg:'Para usar la reserva de FC hace falta una FC de reposo válida.'};
  const L=p=>Math.round(res?hrrest+p/100*(hrmax-hrrest):p/100*hrmax),pts=[cfg.floor,...cfg.cuts].map(L),items=[];
  for(let i=0;i<5;i++)items.push({n:'Z'+(i+1),t:ZTXT[i].slice(3),lo:pts[i],hi:i<4?pts[i+1]:null,p0:i?cfg.cuts[i-1]:cfg.floor,p1:i<4?cfg.cuts[i]:100});
  return {ok:true,model:'pct',base:cfg.base,text:(res?'Reserva de FC (Karvonen: FCrep + % × (FCmáx − FCrep))':'Porcentaje de la FC máxima')+', límites '+[cfg.floor,...cfg.cuts].join(' / ')+' %',items};
}
function zoneIdx(zs,v){ // 0 = por debajo de la primera zona, 1..n = zonas
  if(v==null)return -1;let k=0;for(let i=0;i<zs.items.length;i++)if(v>=zs.items[i].lo)k=i+1;return k;
}
function zoneSecs(sr,zs){const o=new Array(zs.items.length+1).fill(0);sr.forEach(v=>{const k=zoneIdx(zs,v);if(k>=0)o[k]++});return o}
function restAnalyze(t,b,a,e,pos){
  const dur=(e-a)/1000,skip=dur>=120?60:0,from=a+skip*1000,sr=hrSeries(t,b,from,e),v=valid(sr);
  if(v.length<30)return {ok:false,hr:null,dur:rnd(dur),pos:pos||'',note:'Datos insuficientes en el reposo.'};
  let best=null;
  if(sr.length>=60){for(let i=0;i+60<=sr.length;i++){const w=valid(sr.slice(i,i+60));if(w.length>=50){const m=mean(w);if(best==null||m<best)best=m}}}
  const ok=dur>=120&&best!=null,hr=rnd(best!=null?best:mean(v));
  return {ok,hr,dur:rnd(dur),pos:pos||'',avg:rnd(mean(v),1),note:ok?'':(dur<120?'Reposo menor a 2 min: no cumple el protocolo.':'No hubo 60 s continuos con datos.')};
}
function recAnalyze(t,b,a,mode,planSec,hrrest){
  const pre=hrSeries(t,b,a-10000,a),vp=valid(pre),hr0=vp.length>=5?mean(vp):null;
  const n=planSec||120,sr=hrSeries(t,b,a,a+n*1000),at=s=>{const w=valid(sr.slice(Math.max(0,s-3),s+2));return w.length>=3?mean(w):null};
  const h1=n>=60?at(60):null,h2=n>=120?at(120):null,h3=n>=180?at(180):null;
  let t50=null,t50state='';
  if(hr0!=null&&hrrest>0&&hr0>hrrest+10){const tg=hr0-0.5*(hr0-hrrest),sm=smooth(sr,5);const i=sm.findIndex(v=>v!=null&&v<=tg);if(i>=0)t50=i;else t50state='no alcanzado en '+n+' s'}
  const f=v=>v==null?null:rnd(v);
  return {mode:mode||'pasiva',win:n,hr0:f(hr0),hr1:f(h1),hr2:f(h2),hr3:f(h3),d1:hr0!=null&&h1!=null?rnd(hr0-h1):null,d2:hr0!=null&&h2!=null?rnd(hr0-h2):null,
    t50,t50state,cov:rnd(valid(sr).length/Math.max(1,sr.length)*100)};
}
const KEYTEL={m:(h,w,a)=>-55.0969+0.6309*h+0.1988*w+0.2017*a,f:(h,w,a)=>-20.4022+0.4472*h-0.1263*w+0.074*a};
function kcalEst(sr,w,age,sx){
  if(!(w>0&&age>0&&(sx==='m'||sx==='f')))return {ok:false,why:'Faltan peso, edad o sexo del paciente.'};
  let k=0,n=0;sr.forEach(v=>{if(v!=null){k+=Math.max(0,KEYTEL[sx](v,w,age)/4.184)/60;n++}});
  if(!n)return {ok:false,why:'Sin datos de FC.'};
  return {ok:true,kcal:Math.round(k),secs:n,method:'Keytel et al. 2005 (J Sports Sci), a partir de FC, peso, edad y sexo'};
}
function kcalDev(eeT,ee,a,e){
  if(!ee||ee.length<2)return {ok:false,why:'La banda no transmite gasto energético.'};
  const P=[];for(let i=0;i<ee.length;i++)if(eeT[i]>=a-10000&&eeT[i]<=e+10000)P.push(ee[i]);
  if(P.length<2)return {ok:false,why:'La banda no informó gasto durante el esfuerzo.'};
  let kj=0;for(let i=1;i<P.length;i++){let d=P[i]-P[i-1];if(d<0)d=P[i-1]>60000?d+65536:P[i];kj+=d}
  if(kj<=0)return {ok:false,why:'La banda informa gasto en 0 o fijo: no se usa.'};
  return {ok:true,kcal:Math.round(kj/4.184),kj:Math.round(kj),method:'Informado por el dispositivo (contador de energía de la banda, kJ)'};
}
function hrvAnalyze(rrT,rr,a,e){
  const R=[];for(let i=0;i<rr.length;i++)if(rrT[i]>=a&&rrT[i]<=e)R.push(rr[i]);
  if(R.length<20)return {ok:false,why:R.length?'Muy pocos intervalos RR.':'La banda no transmite intervalos RR.'};
  const keep=R.map((v,i)=>{if(v<300||v>2000)return false;const nb=[];for(let j=Math.max(0,i-2);j<=Math.min(R.length-1,i+2);j++)if(j!==i)nb.push(R[j]);const m=median(nb);return Math.abs(v-m)<=0.2*m});
  const K=R.filter((v,i)=>keep[i]),pct=K.length/R.length*100;
  if(K.length<60||pct<90)return {ok:false,why:'Intervalos RR insuficientes o con demasiados artefactos ('+K.length+' válidos, '+rnd(pct)+' %).',n:K.length,validPct:rnd(pct)};
  const d=[];for(let i=1;i<R.length;i++)if(keep[i]&&keep[i-1])d.push(R[i]-R[i-1]);
  const mr=mean(K),rmssd=Math.sqrt(mean(d.map(x=>x*x))),sdnn=Math.sqrt(mean(K.map(x=>(x-mr)*(x-mr))));
  return {ok:true,n:K.length,validPct:rnd(pct),meanRR:rnd(mr),rmssd:rnd(rmssd,1),sdnn:rnd(sdnn,1),lnRmssd:rnd(Math.log(rmssd),2)};
}
function segAnalyze(t,b,segs,zs){
  const out=[];
  segs.forEach((g,i)=>{
    const sr=hrSeries(t,b,g.a,g.b),st=hrStats(sr),v=valid(sr),first=v.slice(0,5),last=v.slice(-5);
    out.push({k:g.k,l:g.l||'',i:g.i||0,a:g.a,b:g.b,dur:rnd((g.b-g.a)/1000),avg:st?rnd(st.avg):null,max:st?rnd(st.max):null,min:st?rnd(st.min):null,
      hr0:first.length?rnd(mean(first)):null,hr1:last.length?rnd(mean(last)):null,drop:null});

/* Análisis completo de una medición. rec={t,b,cf,rrT,rr,eeT,ee,mk}; ctx={hrmax:{v,kind},hrrest,zs,w,age,sx} */
function phyAnalyze(rec,ctx){
  const cl=hrClean(rec.t||[],rec.b||[]),mk=rec.mk||{},ph={v:1,at:rec.t0||0};
  ph.hasRaw=true;ph.nRaw=(rec.t||[]).length;

  const rest=(ph.rest&&ph.rest.hr)||(ctx&&ctx.hrrest)||null;
  if(mk.work&&mk.work.b>mk.work.a){
    const a=mk.work.a,e=mk.work.b,sr=hrSeries(cl.t,cl.b,a,e),st=hrStats(sr),lost=(rec.cf||[]).filter(x=>x>=a&&x<=e).length;
    if(st){

      ph.work={dur:rnd((e-a)/1000),eff:st.n,hr:{min:rnd(st.min),avg:rnd(st.avg),max:rnd(st.max)},
        pMax:hm?{avg:rnd(st.avg/hm*100,1),max:rnd(st.max/hm*100,1)}:null,
        pRes:hm&&rest&&hm>rest?{avg:rnd((st.avg-rest)/(hm-rest)*100,1),max:rnd((st.max-rest)/(hm-rest)*100,1)}:null,
        q:hrQuality(sr,hrClean(rec.t.filter((x,i)=>x>=a&&x<=e),rec.b.filter((x,i)=>rec.t[i]>=a&&rec.t[i]<=e)).out,lost)};
      if(ctx&&ctx.zs&&ctx.zs.ok){const secs=zoneSecs(sr,ctx.zs),tot=secs.reduce((x,y)=>x+y,0)||1;

      ph.segs=segAnalyze(cl.t,cl.b,(mk.segs||[]).filter(g=>g.b>g.a&&g.a>=a-1000&&g.b<=e+1000));

  jackson:{n:'Modelo sin ejercicio (Jackson y cols., 1990)',f:'VO₂máx = 56,363 + 1,921 × PA-R − 0,381 × edad − 0,754 × IMC + 10,987 × sexo',vars:[['PA-R','0 a 7','nivel de actividad física habitual'],['edad','años',''],['IMC','kg/m²','peso ÷ talla²'],['sexo','1 hombre / 0 mujer','']],

    lim:'Validada en adultos de 30 a 69 años que caminan a paso rápido, sin medicación que altere la FC. Es una estimación, no sustituye una prueba con análisis de gases.',kind:'estimada'},
  lab:{n:'VO₂máx medido (prueba con análisis de gases)',f:'Medición directa del consumo de oxígeno',vars:[['VO₂máx','ml·kg⁻¹·min⁻¹','informado por el laboratorio']],lim:'Valor medido: se registra tal como lo informó el laboratorio.',kind:'medida'}

function vo2Calc(model,i){
  const sx=i.sx==='m'?1:0;
  if(model==='uth'){if(!(i.hrmax>0&&i.hrrest>0))return null;return 15.3*i.hrmax/i.hrrest}
  if(model==='jackson'){if(!(i.age>0&&i.wt>0&&i.ht>0&&(i.sx==='m'||i.sx==='f')&&i.par>=0&&i.par<=7&&i.par!=null&&i.par!==''))return null;const bmi=i.wt/Math.pow(i.ht/100,2);return 56.363+1.921*i.par-0.381*i.age-0.754*bmi+10.987*sx}
  if(model==='cooper'){if(!(i.dist>0))return null;return (i.dist-504.9)/44.73}
  if(model==='rock'){if(!(i.wt>0&&i.age>0&&i.min>0&&i.hr>0&&(i.sx==='m'||i.sx==='f')))return null;return 132.853-0.0769*i.wt*2.20462-0.3877*i.age+6.315*sx-3.2649*i.min-0.1565*i.hr}
  return null;
}

/* ===== Lecturas originales: IndexedDB (persistente), con respaldo en memoria si el navegador no lo permite ===== */
const RAWMEM=new Map(),RAWC={};let RAWP=null,RAWFAIL=false;
function rawOpen(){return RAWP||(RAWP=new Promise((ok,no)=>{try{const q=indexedDB.open('perio-raw',1);q.onupgradeneeded=()=>q.result.createObjectStore('raw',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);q.onblocked=()=>no(new Error('blocked'))}catch(e){no(e)}}))}
async function rawTx(mode,fn,mem){
  if(!RAWFAIL){try{const db=await rawOpen();return await new Promise((ok,no)=>{const tx=db.transaction('raw',mode),r=fn(tx.objectStore('raw'));tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)})}catch(e){RAWFAIL=true;try{setStatus('Este navegador no permite guardar las lecturas de forma persistente')}catch(x){}}}
  return mem();
}
const rawPut=o=>{RAWC[o.id]=o;return rawTx('readwrite',s=>s.put(o),()=>{RAWMEM.set(o.id,o)})};
async function rawGet(id){if(RAWC[id])return RAWC[id];const r=await rawTx('readonly',s=>s.get(id),()=>RAWMEM.get(id));if(r)RAWC[id]=r;return r||null}
const rawDel=id=>{delete RAWC[id];return rawTx('readwrite',s=>s.delete(id),()=>{RAWMEM.delete(id)})};
const rawAll=()=>rawTx('readonly',s=>s.getAll(),()=>[...RAWMEM.values()]);
const rawKeys=()=>rawTx('readonly',s=>s.getAllKeys(),()=>[...RAWMEM.keys()]);

}

const HR={ph:'idle',run:false,sid:'',gs:null,t0:0,mk:{segs:[]},pt:0,msg:'',wl:null,recMode:'pasiva',restSec:180,recSec:120,restPos:'sentado',seg:null,ex:'',sets:{},lastUi:0,lastDraft:0,conf:false};
/* Hasta 2 bandas a la vez (canales A y B). Cada canal tiene su dispositivo, su lectura en vivo, sus lecturas originales y el participante (sid = id de su registro de sesión) que la usa. */
const CH=['A','B'].map(id=>({id,dev:null,devName:'',ok:false,bpm:0,spark:[],sid:'',raw:null,ctx:null,tries:0}));
function hrParse(dv){
  const f=dv.getUint8(0);let o,b;
  if(f&1){b=dv.getUint16(1,true);o=3}else{b=dv.getUint8(1);o=2}
  const r={b,lost:((f>>1)&3)===2,ee:null,rr:[]};
  if(f&8){r.ee=dv.getUint16(o,true);o+=2}
  if(f&16){while(o+1<dv.byteLength){r.rr.push(dv.getUint16(o,true)*1000/1024);o+=2}}
  return r;
}
function hrSample(c,r){
  const now=Date.now();
  if(r.b>=30&&r.b<=230){c.bpm=r.b;c.spark.push([now,r.b]);while(c.spark.length&&now-c.spark[0][0]>180000)c.spark.shift()}
  if(HR.run&&c.sid){if(!c.raw)c.raw={t0:HR.t0,t:[],b:[],cf:[],rrT:[],rr:[],eeT:[],ee:[]};const R=c.raw,off=now-HR.t0;R.t.push(off);R.b.push(r.b);if(r.lost)R.cf.push(off);r.rr.forEach(x=>{R.rrT.push(off);R.rr.push(Math.round(x*10)/10)});if(r.ee!=null){R.eeT.push(off);R.ee.push(r.ee)}}
  if(now-HR.lastUi>=500){HR.lastUi=now;hrLive()}
}
const chOf=id=>CH.find(c=>c.id===id)||CH[0];
const hrAny=()=>CH.some(c=>c.ok);
const hrMems=()=>V.EG&&V.EG.length?V.EG:(HR.gs||[]);
const chMem=c=>c.sid?(hrMems().find(m=>m.id===c.sid)||S.sessions.find(m=>m.id===c.sid)||null):null;
const chName=c=>{const m=chMem(c);return m?((pat(m.pid)&&pat(m.pid).name)||'?'):''};
const joinY=a=>a.length>1?a.slice(0,-1).join(', ')+' y '+a[a.length-1]:(a[0]||'');
function hrZoneOf(c,b){const z=c.ctx&&c.ctx.zs;if(!z||!z.ok||!b)return null;const k=zoneIdx(z,b);return {n:k===0?'Bajo Z1':z.items[k-1].n,c:Math.min(k,5)}}
function hrSubText(c){
  const b=c.bpm,x=c.ctx||{},p=[];
  if(!c.sid)return 'Elige de quién es esta banda.';
  if(!b)return 'Sin lecturas de la banda todavía.';
  const hm=x.hrmax&&x.hrmax.v;
  if(hm){p.push(Math.round(b/hm*100)+' % de la FCmáx ('+hm+' lpm, '+x.hrmax.kind+')');if(x.hrrest&&hm>x.hrrest)p.push(Math.round((b-x.hrrest)/(hm-x.hrrest)*100)+' % de la reserva')}
  else p.push('Agrega la edad o una FC máxima del paciente para ver porcentajes y zonas');
  const z=hrZoneOf(c,b);if(z)p.push(z.n);
  if(hm&&b>hm)p.push('sobre la FCmáx de referencia: puede estar subestimada');
  return p.join(' · ');
}
function sparkSVG(c){
  const d=c.spark;if(d.length<2)return '';const W=300,H=44,t1=d[d.length-1][0],t0=t1-180000,v=d.map(x=>x[1]),lo=Math.min(...v)-4,hi=Math.max(...v)+4;
  const pts=d.map(x=>((x[0]-t0)/180000*W).toFixed(1)+','+(H-(x[1]-lo)/(hi-lo)*H).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="44" role="img" aria-label="FC de los últimos 3 minutos, banda ${c.id}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" style="stroke:var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function hrPaint(){const b=$('#hrbox');if(b){b.innerHTML=hrHTML();hrLive();hrTick()}}
async function hrWake(on){try{if(on&&navigator.wakeLock){if(!HR.wl)HR.wl=await navigator.wakeLock.request('screen')}else if(HR.wl){await HR.wl.release();HR.wl=null}}catch(e){HR.wl=null}}
async function hrAttach(c){
  const d=c.dev,sv=await d.gatt.connect(),sc=await sv.getPrimaryService('heart_rate'),ch=await sc.getCharacteristic('heart_rate_measurement');
  ch.addEventListener('characteristicvaluechanged',ev=>{try{hrSample(c,hrParse(ev.target.value))}catch(e){}});
  await ch.startNotifications();c.ok=true;c.tries=0;
}
async function hrConnect(id){
  const c=chOf(id);HR.msg='';
  if(!navigator.bluetooth){HR.msg='Este navegador no permite Bluetooth. Abre la app instalada en Chrome, en Android.';hrPaint();return}
  try{
    HR.msg='Buscando la banda '+c.id+'…';hrPaint();
    let d=c.dev;
    if(!d){
      d=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
      const o=CH.find(x=>x!==c&&x.dev&&x.dev.id===d.id);
      if(o){const er=new Error('banda repetida');er.name='DupError';er.other=o.id;throw er}
      c.dev=d;c.devName=d.name||'Banda Bluetooth';
      d.addEventListener('gattserverdisconnected',()=>{if(c.dev!==d)return;c.ok=false;c.bpm=0;HR.msg='Banda '+c.id+' desconectada.'+(HR.run?' Intentando reconectar…':'');hrPaint();if(HR.run)setTimeout(()=>hrRetry(c),1500)});
    }
    await hrAttach(c);
    let nota='';
    if(!c.sid&&!HR.run){
      const mem=hrMems(),used=CH.filter(x=>x!==c&&x.sid).map(x=>x.sid),cand=(V.ED&&!used.includes(V.ED.id)&&mem.length===1)?V.ED:(mem.length>1?null:mem.find(m=>!used.includes(m.id)));
      if(cand){c.sid=cand.id;c.ctx=phyCtx(pat(cand.pid))}
      else if(mem.length>1)nota=' Elige de quién es esta banda en la lista "Participante".';
    }
    HR.msg='Banda '+c.id+' conectada: '+c.devName+'.'+nota;
  }catch(e){
    c.ok=false;
    if(e&&e.name==='DupError')HR.msg='Esa banda ya está conectada como banda '+e.other+'. Elige la otra banda.';
    else HR.msg=e&&e.name==='NotFoundError'?'No se eligió ninguna banda.':e&&e.name==='SecurityError'?'Este navegador bloqueó el Bluetooth en esta página. Usa la app instalada en Chrome o anota los valores a mano.':'No se pudo conectar la banda '+c.id+': '+((e&&e.message)||'error')+'. Cierra otras apps que usen la banda e intenta de nuevo. Las demás bandas siguen funcionando.';
  }
  hrPaint();
}
async function hrRetry(c){
  if(c.ok||!HR.run||!c.dev||c.tries>=8)return;c.tries++;
  try{await hrAttach(c);HR.msg='Banda '+c.id+' reconectada.';hrPaint()}catch(e){setTimeout(()=>hrRetry(c),2000)}
}
function hrNewRun(){
  HR.run=true;HR.sid=V.ED.id;HR.gs=clone(V.EG&&V.EG.length?V.EG:[V.ED]);HR.t0=Date.now();HR.mk={segs:[]};HR.seg=null;HR.sets={};HR.conf=false;HR.lastDraft=0;
  CH.forEach(c=>{const m=c.sid?HR.gs.find(x=>x.id===c.sid):null;c.ctx=m?phyCtx(pat(m.pid)):null;c.raw=m?{t0:HR.t0,t:[],b:[],cf:[],rrT:[],rr:[],eeT:[],ee:[]}:null});
  hrWake(true);
}
const hrOff=()=>Date.now()-HR.t0;
function hrBegin(ph){
  if(!HR.run){
    if(!CH.some(c=>c.ok&&c.sid)){HR.msg='Asigna cada banda conectada a un participante antes de medir.';hrPaint();return}
    hrNewRun();
  }
  const off=hrOff();
  if(HR.mk.rest&&HR.mk.rest.b==null)HR.mk.rest.b=off;
  if(ph==='rest')HR.mk.rest={a:off,b:null,pos:HR.restPos};
  if(ph==='work'){HR.mk.work={a:off,b:null};HR.mk.segs=[];HR.seg=null;HR.sets={}}
  HR.ph=ph;HR.pt=Date.now();
  const un=CH.filter(c=>c.ok&&!c.sid).map(c=>c.id);
  HR.msg=un.length?'La banda '+joinY(un)+' no tiene participante asignado y no se registrará.':'';
  hrPaint();
}

function bandBeep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),t=a.currentTime;[0,0.35,0.7].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+0.2)});setTimeout(()=>{try{a.close()}catch(e){}},1500)}catch(e){}}
let BAND={on:false,n:0,iv:0};
function bandRemind(names){
  if(BAND.on)return;BAND.on=true;BAND.n=0;
  const nm=(names||[]).filter(Boolean),many=nm.length>1,who=joinY(nm);
  const o=document.createElement('div');o.id='bandrem';o.setAttribute('role','alertdialog');o.setAttribute('aria-live','assertive');
  o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML='<div style="background:var(--surface,#fff);color:var(--ink,#111);border-radius:16px;padding:22px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);border:3px solid #D97706"><div style="font-size:44px;line-height:1">⚠️</div><h3 style="margin:8px 0 6px;font-size:22px">'+(who?'Quita la banda a '+esc(who):'Quita la banda al paciente')+'</h3><p style="margin:0 0 14px;font-size:16px">La medición terminó. Retira '+(many?'las bandas':'la banda')+' de frecuencia cardíaca antes de que se vayan.</p><button class="btn" id="bandok" style="width:100%;font-size:17px;padding:14px">'+(many?'Ya retiré las bandas':'Ya retiré la banda')+'</button></div>';
  document.body.appendChild(o);
  const nag=()=>{hrBuzz();bandBeep()};nag();

/* Gráfico de araña de la evaluación: cada eje es una prueba, comparada con la mejor marca del propio paciente (100 %). */
function evMain(e,t){const ks=t.rad||[t.f[0][0]],v=ks.map(k=>evVal(e,t.k,k)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function evRadarData(p,L){
  if(L.length<2)return null;const first=L[0],last=L[L.length-1],ax=[];
  evAll(p).forEach(t=>{const vs=L.map(e=>evMain(e,t)),a=evMain(first,t),b=evMain(last,t),h=vs.filter(x=>x!=null);
    if(a==null||b==null||h.length<2)return;
    const down=t.b==='down',best=down?Math.min(...h.filter(x=>x>0)):Math.max(...h);if(!(best>0))return;
    const sc=v=>down?(v>0?Math.min(100,best/v*100):0):Math.max(0,Math.min(100,v/best*100));
    ax.push({l:t.s||t.n,a,b,pa:sc(a),pb:sc(b),u:(t.f[0][2]||''),down});
  });
  return ax.length>=3?ax:null;
}
function evRadarSVG(ax,K){
  const cx=220,cy=170,rad=92,n=ax.length,f1=a=>a.map(q=>q.toFixed(1)).join(',');
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*rad*v/100,cy+Math.sin(a)*rad*v/100]};
  let s=`<svg class="rd" viewBox="0 0 440 340" width="100%" role="img" aria-label="Gráfico de araña con el resultado de la primera y de la última evaluación en cada prueba" font-family="Figtree,system-ui,sans-serif">`;
  [25,50,75,100].forEach(g=>{s+=`<polygon points="${ax.map((_,i)=>f1(pt(i,g))).join(' ')}" fill="none" style="stroke:${K.line}" stroke-width="1"/>`});
  ax.forEach((x,i)=>{const [ex,ey]=pt(i,100),[lx,ly]=pt(i,128),an=Math.abs(lx-cx)<10?'middle':lx<cx?'end':'start',fm=v=>String(Math.round(v*10)/10).replace('.',',');
    s+=`<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" style="stroke:${K.line}" stroke-width="1"/><text x="${lx.toFixed(1)}" y="${(ly+(i===0?-4:2)).toFixed(1)}" text-anchor="${an}" font-size="15" font-weight="600" style="fill:${K.ink}">${esc(x.l)}</text><text x="${lx.toFixed(1)}" y="${(ly+(i===0?-4:2)+16).toFixed(1)}" text-anchor="${an}" font-size="13" style="fill:${K.mut}">${fm(x.a)} → ${fm(x.b)}${x.u?' '+esc(x.u):''}</text>`});
  s+=`<polygon points="${ax.map((x,i)=>f1(pt(i,x.pa))).join(' ')}" fill="none" style="stroke:${K.mut}" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>`;
  s+=`<polygon points="${ax.map((x,i)=>f1(pt(i,x.pb))).join(' ')}" style="fill:${K.s[0]};stroke:${K.s[0]}" fill-opacity=".22" stroke-width="3" stroke-linejoin="round"/>`;
  ax.forEach((x,i)=>{const [px,py]=pt(i,x.pb);s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" style="fill:${K.s[0]}"><title>${esc(x.l)}: ${Math.round(x.pb)} % de tu mejor marca</title></circle>`});
  return s+'</svg>';
}
function evBlk(R,K,pac){
  const p=R.p,end=iso(new Date(R.y,R.m+1,0)),L=evList(p).filter(e=>e.date<=end);if(!L.length)return '';

  return `<h3>${pac?'Tu evaluación física':'Evaluación física'}</h3><p class="sub">${pac?`Pruebas simples para ver cómo está tu condición y cómo vas mejorando. Última evaluación: ${e(fdate(last.date))}.`:`Última evaluación: ${e(fdate(last.date))} (${e(evTyp(p,last))}).${L.length>1?' Se compara con la primera ('+e(fdate(first.date))+').':''}`}</p>
  ${ax?`${evRadarSVG(ax,K)}<div class="lgd"><span><u style="border-top:3px dashed ${K.mut}"></u>Primera evaluación (${e(sd(pd(first.date)))})</span><span><u style="border-top:4px solid ${K.s[0]}"></u>Última (${e(sd(pd(last.date)))})</span></div><p class="sub">Cada punta es una prueba. El borde exterior es tu mejor resultado en esa prueba (100 %): mientras más se acerca tu figura al borde, mejor estás. En las pruebas donde menos tiempo es mejor, como Levántate y anda, el gráfico ya lo tiene en cuenta. Debajo de cada nombre están tus resultados, de la primera a la última vez.</p>`:(pac&&L.length<2?'<p class="sub">Con tu próxima evaluación verás aquí un gráfico que compara cómo vas.</p>':'')}

  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset;
  if(a==='ov'){if(e.target===t){closeEd();drawModal()}return}
  if(a==='phov'){if(e.target===t){V.PH=null;drawModal()}return}
  if(a==='paid'){const s=S.sessions.find(x=>x.id===d.id);s.paid=t.checked;saveSes(s.id);render();return}
  if(a==='tab'){V.tab=d.t;V.armed=null;render()}
  else if(a==='addp'){const p=newPat();S.patients.push(p);S.sel=p.id;saveMeta();render()}
  else if(a==='delp'){if(V.armed==='p'+d.id){S.sessions.filter(s=>s.pid===d.id).forEach(s=>{D.ses.add(s.id);rawDel(s.id)});S.sessions=S.sessions.filter(s=>s.pid!==d.id);S.patients=S.patients.filter(p=>p.id!==d.id);if(S.sel===d.id)S.sel='';V.armed=null;saveMeta();queue()}else V.armed='p'+d.id;render()}
  else if(a==='resetpct'){const p=curP()||S.patients[0];p.pct=defPct();saveMeta();render()}
  else if(a==='addseg'){const p=curP()||S.patients[0];p.segs.push(S0(d.lane,'Nuevo tramo',1,4));saveMeta();$('#segs').innerHTML=segsHTML(p);$('#chart').innerHTML=chartSVG(p)}
  else if(a==='delseg'){const p=curP()||S.patients[0];p.segs.splice(+d.i,1);saveMeta();$('#segs').innerHTML=segsHTML(p);$('#chart').innerHTML=chartSVG(p)}
  else if(a==='mon'){V.mon=new Date(V.mon.getFullYear(),V.mon.getMonth()+ +d.n,1);render()}
  else if(a==='gday'){V.day=d.d;V.view='day';const x=pd(d.d);V.mon=new Date(x.getFullYear(),x.getMonth(),1);render()}
  else if(a==='today'){V.day=iso(new Date());V.mon=new Date(now0.getFullYear(),now0.getMonth(),1);render()}
  else if(a==='view'){V.view=d.v;render()}
  else if(a==='cnav'){const x=pd(V.day),n=+d.n;if(V.view==='month')x.setMonth(x.getMonth()+n,1);else x.setDate(x.getDate()+n*(V.view==='week'?7:1));V.day=iso(x);V.mon=new Date(x.getFullYear(),x.getMonth(),1);render()}
  else if(a==='slot'){const y=e.clientY-t.getBoundingClientRect().top,mn=Math.min(Math.floor(y/48*2)/2*60+ +d.lo*60,1380);openEd(null,d.d,fmt(mn))}
  else if(a==='newses')openEd(null,V.day);
  else if(a==='edses')openEd(d.id);
  else if(a==='usebase'){V.calc.base=String(d.kg||'');$('#cb').value=V.calc.base;updCalc()}
  else if(a==='usepct'){V.calc.pct=String(d.v);$('#cp').value=d.v;updCalc()}
  else if(a==='usee'){if(V.calc.e){V.calc.base=String(V.calc.e);$('#cb').value=V.calc.e;updCalc()}}
  else if(a==='addrm'){const p=curP();p.rms=p.rms||[];p.rms.push({id:uid(),n:'',kg:''});saveMeta();render()}
  else if(a==='delrm'){const p=curP();p.rms=(p.rms||[]).filter(x=>x.id!==d.id);saveMeta();render()}
  else if(a==='repcp'){const p=curP()||S.patients[0];{const R0=repData(p,V.mon.getFullYear(),V.mon.getMonth());copyTxt(V.rt==='pac'?pacTxt(R0):repTxt(R0))}}
  else if(a==='reppdf')repPdf();
  else if(a==='rtype'){V.rt=d.v==='pac'?'pac':'pro';render()}
  else if(a==='fixprice'){const r=clp(pat(d.p).rate);monthSes().filter(x=>x.pid===d.p&&x.est!=='canc'&&!x.paid&&pr(x)!==r).forEach(x=>{x.price=r;D.ses.add(x.id)});queue();render()}
  else if(a==='payall'){monthSes().filter(s=>s.pid===d.p&&s.est!=='canc').forEach(s=>{s.paid=true;D.ses.add(s.id)});queue();render()}
  else if(a==='export')exportBackup();
  else if(a==='exportp')exportPatient(d.id);
  else if(a==='addex'){const s=V.ED;s.exs.push({c:d.c,n:'',s:'',r:'',p:''});V.focus=s.exs.length-1;drawModal()}
  else if(a==='delex'){V.ED.exs.splice(+d.i,1);drawModal()}
  else if(a==='hrconn')hrConnect(d.ch);
  else if(a==='hrdisc'){const c=chOf(d.ch);if(!HR.run){const dv=c.dev;c.dev=null;c.devName='';c.ok=false;c.bpm=0;try{if(dv&&dv.gatt&&dv.gatt.connected)dv.gatt.disconnect()}catch(x){}HR.msg='Banda '+c.id+' desconectada.';hrPaint()}}
  else if(a==='hrrest'){if(hrAny())hrBegin('rest')}
  else if(a==='hrrestend')hrEndRest();
  else if(a==='hrwork'){if(hrAny())hrBegin('work')}
  else if(a==='hrworkend')hrEndWork();
  else if(a==='hrserie')hrMark('serie');
  else if(a==='hrdesc')hrMark('descanso');
  else if(a==='hrstop')hrFinalize();
  else if(a==='hrcancel'){if(HR.conf){const nm=CH.filter(c=>c.sid&&(c.ok||c.raw)).map(chName).filter(Boolean);HR.run=false;HR.ph='idle';CH.forEach(c=>{c.raw=null});HR.mk={segs:[]};HR.seg=null;HR.conf=false;hrWake(false);rawDel('draft');HR.msg='Medición descartada.';bandRemind(nm)}else HR.conf=true;hrPaint()}
  else if(a==='hrrecover'){(async()=>{setStatus('Recuperando medición…');let ok=false;try{ok=await hrRecover()}catch(x){}V.draft=null;setStatus(ok?'Medición recuperada y guardada':'No se pudo recuperar la medición');render()})()}
  else if(a==='hrdiscard'){rawDel('draft');V.draft=null;render()}
  else if(a==='phview'){V.PH=d.id;drawModal()}
  else if(a==='phclose'){V.PH=null;drawModal()}
  else if(a==='phrean')phRean(d.id);
  else if(a==='phadd'){const p=curP()||S.patients[0],box=t.closest('.frm'),v={};box.querySelectorAll('[data-ff]').forEach(i=>{v[i.dataset.ff]=i.value.trim()});const m=phAdd(p,d.kind,v);if(m)setStatus(m);else{saveMeta();render();setStatus('Guardado')}}
  else if(a==='phdel'){const p=curP()||S.patients[0];if(d.kind==='wt'){p.wlog=(p.wlog||[]).filter(x=>x.id!==d.id);p.wt=String(pWt(p)||'')}else if(d.kind==='thr')delete p.thr;else if(d.kind==='ev')p.ev=(p.ev||[]).filter(x=>x.id!==d.id);else if(d.kind==='vo2')p.vo2=(p.vo2||[]).filter(x=>x.id!==d.id);saveMeta();render()}
  else if(a==='phsaveest'){const p=curP()||S.patients[0],o=vo2Now(p)[d.m];if(o&&o.val!=null){(p.vo2=p.vo2||[]).push({id:uid(),date:iso(new Date()),model:d.m,inp:o.i,val:rnd(o.val,1),kind:'estimada'});saveMeta();render();setStatus('Estimación guardada')}}
  else if(a==='evnew'){const p=curP()||S.patients[0];V.evd=Object.assign(evNew(p),{pid:p.id});render()}
  else if(a==='evedit'){const p=curP()||S.patients[0],e=(p.evals||[]).find(x=>x.id===d.id);if(e){V.evd=clone(e);V.evd.pid=p.id;V.evd.r=V.evd.r||{};render()}}
  else if(a==='evdel'){const p=curP()||S.patients[0];if(V.armed==='e'+d.id){p.evals=(p.evals||[]).filter(x=>x.id!==d.id);V.armed=null;saveMeta()}else V.armed='e'+d.id;render()}
  else if(a==='evcancel'){V.evd=null;render()}
  else if(a==='evaddt'){const p=curP()||S.patients[0],n=($('#evtn')||{}).value||'';if(n.trim()){(p.evt=p.evt||[]).push({id:uid(),n:n.trim(),u:(($('#evtu')||{}).value||'').trim(),b:($('#evtb')||{}).value==='down'?'down':'up'});saveMeta();render()}else setStatus('Escribe el nombre de la prueba')}
  else if(a==='evdelt'){const p=curP()||S.patients[0];p.evt=(p.evt||[]).filter(x=>x.id!==d.id);saveMeta();render()}
  else if(a==='evsave'){const p=curP()||S.patients[0],e=V.evd;if(!e)return;
    const any=evAll(p).some(t=>t.f.some(f=>evVal(e,t.k,f[0])!=null));
    if(!any){setStatus('Anota el resultado de al menos una prueba');return}
    const o=clone(e);delete o.isNew;delete o.pid;
    Object.keys(o.r||{}).forEach(k=>{const r=o.r[k];if(!Object.values(r).some(v=>String(v||'').trim()))delete o.r[k]});
    p.evals=p.evals||[];const i=p.evals.findIndex(x=>x.id===o.id);if(i>=0)p.evals[i]=o;else p.evals.push(o);
    const kg=evn(o.peso);if(kg>20&&kg<400&&!(p.wlog||[]).some(x=>x.date===o.date&&num(x.kg)===kg))phAdd(p,'wt',{date:o.date,kg:String(kg)});
    V.evd=null;saveMeta();render();setStatus('Evaluación guardada')}
  else if(a==='clrtxt'){V.ED.txt='';drawModal()}
  else if(a==='edpart'){syncShared();const m=(V.EG||[]).find(x=>x.id===d.id);if(m){V.ED=m;V.armed=null;drawModal()}}
  else if(a==='edrm')removePart(d.id);
  else if(a==='copylast'){const s=V.ED,pv=S.sessions.filter(x=>x.pid===s.pid&&x.id!==s.id&&(x.exs||[]).some(hasEx)&&x.date<=s.date).sort((x,y)=>y.date.localeCompare(x.date))[0];
    if(pv){s.exs=clone(pv.exs);V.edMsg='Copiados los ejercicios de la sesión del '+pd(pv.date).toLocaleDateString('es-CL')+'.'}else V.edMsg='Este paciente no tiene sesiones anteriores con ejercicios.';drawModal()}
  else if(a==='savees'){const s=V.ED;if(!s.date||!s.pid)return;syncShared();const G=V.EG&&V.EG.length?V.EG:[s];
    (V.EGdel||[]).forEach(id=>{S.sessions=S.sessions.filter(x=>x.id!==id);rawDel(id);saveSes(id)});
    G.forEach(m=>commitSession(m));
    V.day=s.date;const dt=pd(s.date);V.mon=new Date(dt.getFullYear(),dt.getMonth(),1);closeEd();render()}
  else if(a==='delses'){const s=V.ED,ids=[...(V.EG||[s]).map(x=>x.id),...(V.EGdel||[])];if(V.armed==='s'+s.id){S.sessions=S.sessions.filter(x=>!ids.includes(x.id));ids.forEach(id=>{rawDel(id);saveSes(id)});closeEd();render()}else{V.armed='s'+s.id;drawModal()}}
  else if(a==='closeed'){closeEd();drawModal()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(V.PH){V.PH=null;drawModal()}else if(V.ED){closeEd();drawModal()}}});
document.addEventListener('input',e=>{const t=e.target,s=V.ED;if(t.dataset.hro){const k=t.dataset.hro;HR[k]=(k==='restSec'||k==='recSec')?+t.value:t.value}if(s&&t.dataset.sf)s[t.dataset.sf]=t.value;if(s&&t.dataset.sym){const k=t.dataset.sym,a=s.sym=s.sym||[];const i=a.indexOf(k);if(t.checked&&i<0)a.push(k);if(!t.checked&&i>=0)a.splice(i,1)}if(s&&t.dataset.fc){s.fc=s.fc||{};s.fc[t.dataset.fc]=t.value}if(s&&t.dataset.e!==undefined&&s.exs[+t.dataset.e])s.exs[+t.dataset.e][t.dataset.f]=t.value});
document.addEventListener('input',e=>{const c=e.target.dataset.c;if(c){V.calc[c]=e.target.value;updCalc()}});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.addpart!==undefined){if(t.value)addPart(t.value);return}
  if(d.hrch){const c=chOf(d.hrch);if(!HR.run){c.sid=t.value;const m=chMem(c);c.ctx=m?phyCtx(pat(m.pid)):null;HR.msg=''}hrPaint();return}
  if(d.k&&V.ED){const s=V.ED;if(d.k==='paid')s.paid=t.checked;else if(d.k==='price'){s.price=clp(t.value);t.value=s.price;s.pt=true}else{s[d.k]=t.value;if(d.k==='pid'&&s.isNew&&!s.pt){s.price=pat(s.pid)?.rate||0;const pi=$('[data-k="price"]');if(pi)pi.value=s.price}}const ei=$('#edinfo');if(ei)ei.innerHTML=edInfo(s);if(d.k==='pid'){CH.forEach(c=>{if(c.sid===s.id)c.ctx=phyCtx(pat(s.pid))});setTimeout(drawModal,0)}return}
  if(d.rm){const p=curP(),r=((p&&p.rms)||[]).find(x=>x.id===d.rm);if(!r)return;if(d.f==='kg'){r.kg=num(t.value)||'';t.value=r.kg;const b=t.closest('.rm').querySelector('[data-act="usebase"]');if(b)b.dataset.kg=r.kg}else r.n=t.value;saveMeta();return}
  if(d.sel!==undefined){S.sel=t.value;saveMeta();render();return}
  if(d.pct!==undefined){const p=curP()||S.patients[0],v=Math.max(0,Math.min(100,+t.value||0));p.pct[+d.pct]=v;t.value=v;t.parentElement.className='wk c-'+cls(v);$('#chart').innerHTML=chartSVG(p);saveMeta();return}
  if(d.seg!==undefined){const p=curP()||S.patients[0],g=p.segs[+d.seg];g[d.f]=d.f==='label'?t.value:Math.max(1,Math.min(48,+t.value||1));$('#chart').innerHTML=chartSVG(p);saveMeta();return}
  if(d.rp){const p=pat(d.p);if(!p)return;p.pr=p.pr||{};const o=p.pr[d.pk]=p.pr[d.pk]||{};o[d.rp]=t.value;saveMeta();pacRefresh();return}
  if(d.sf==='rpe'&&V.ED){V.ED.rpe=t.value;setTimeout(drawModal,0);return}
  if(d.px){const p=pat(d.p);if(!p)return;spx(p,d.px,t.tagName==='SELECT'?t.value:num(t.value));saveMeta();setTimeout(render,0);return}
  if(d.pf){const p=pat(d.p);if(d.pf==='rate'){const o=clp(p.rate),n=clp(t.value);p.rate=n;t.value=n;if(n!==o){const td=iso(new Date());S.sessions.forEach(x=>{if(x.pid===p.id&&!x.paid&&x.est!=='canc'&&pr(x)===o&&(o===0||x.date>=td)){x.price=n;D.ses.add(x.id)}})}}else{p[d.pf]=t.value;if(d.pf==='wt'&&num(t.value)>20){const l=(p.wlog=p.wlog||[]);if(!l.length||num(l[l.length-1].kg)!==num(t.value))l.push({id:uid(),date:iso(new Date()),kg:num(t.value)})}}saveMeta();if(V.tab==='fis')setTimeout(render,0);return}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j&&j.kind==='patient'){importPatient(j);t.value='';return}if(!Array.isArray(j.patients)||!Array.isArray(j.sessions))throw 0;S={patients:j.patients,sessions:j.sessions.map(norm),sel:j.sel||''};importRaw(j);D.meta=true;S.sessions.forEach(s=>D.ses.add(s.id));queue();render()}catch(x){setStatus('El archivo no es un respaldo válido')}};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(!V.evd||!d)return;
  if(d.evf!==undefined){const o=V.evd.r[d.evf]=V.evd.r[d.evf]||{};o[d.evk]=t.value}
  else if(d.evh!==undefined)V.evd[d.evh]=t.value});
init();
</script>
